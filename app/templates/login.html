{% extends "base.html" %}
{% block title %}Admin Login - Tamil Nadu Smart Transit{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: calc(100vh - 80px);
        background: linear-gradient(135deg, #f8fafc, #e2e8f0);
    }
    .login-card {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
        border-top: 5px solid var(--primary);
    }
    .login-input {
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 20px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-size: 1rem;
        box-sizing: border-box;
    }
    .login-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }
    .login-btn {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: none;
        background: linear-gradient(135deg, var(--primary), #6d28d9);
        color: white;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }
    
    /* HIDE ADMIN SHELL ELEMENTS FOR PUBLIC USER */
    .sidebar { display: none !important; }
    .main-content { margin-left: 0 !important; width: 100% !important; }
    .header-actions { display: none !important; }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h2 style="margin-top: 0; color: #1e293b;">🔒 Admin Login</h2>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 30px;">
            Higher Authorities & Dispatch AI Access
        </p>
        
        <form action="/dashboard" method="GET">
            <input type="text" class="login-input" placeholder="Admin ID or Email" required>
            <input type="password" class="login-input" placeholder="Password" required>
            
            <button type="submit" class="login-btn">Secure Login</button>
        </form>
        
        <p style="margin-top: 25px; font-size: 0.8rem; color: #94a3b8;">
            Protected by Tamil Nadu Transport Dept. Security.
        </p>
    </div>
</div>
{% endblock %}
