version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: smart_gov_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_gov_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    container_name: smart_gov_web
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smart_gov_db
    depends_on:
      - db
    volumes:
      - .:/app
    command: python wsgi.py

volumes:
  postgres_data:
